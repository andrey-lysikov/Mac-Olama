name: Build app from main

# Builds the app from the current main and attaches it to the run as a zip; nothing is published.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Build and export the app
        run: |
          xcodebuild -downloadComponent MetalToolchain || true

          # -skipMacroValidation: mlx-swift-lm ships a macro target and CI cannot answer "Trust & Enable"
          xcodebuild -skipMacroValidation -skipPackagePluginValidation \
                     -project MacOlama.xcodeproj -scheme MacOlama -configuration Release \
                     -destination 'platform=macOS,arch=arm64' -archivePath build/Mac-Olama.xcarchive \
                     CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= archive

          xcodebuild -exportArchive -archivePath build/Mac-Olama.xcarchive \
                     -exportPath build -exportOptionsPlist ExportOptions.plist

      - name: Pack the app
        id: pack
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Mac-Olama.app/Contents/Info.plist)
          name="Mac-Olama-$version-$(git rev-parse --short HEAD)"
          # ditto, not zip: it keeps the bundle's symlinks, permissions and extended attributes intact.
          ditto -c -k --keepParent build/Mac-Olama.app "$name.zip"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.zip
          if-no-files-found: error
